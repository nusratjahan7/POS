[project]
name = "pos-backend"
version = "0.1.0"
description = "POS platform — FastAPI backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    # 2.1 makes the compiled cyextension mandatory; 2.0.x falls back to pure
    # Python, which keeps the app importable on hosts with strict Application
    # Control policies. Revisit once the C extension is reliably permitted.
    "sqlalchemy[asyncio]>=2.0.36,<2.1",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "email-validator>=2.2.0",
    "pyjwt>=2.10.0",
    "pwdlib[argon2]>=0.2.1",
    "orjson>=3.10.0",
    # Required by FastAPI for multipart/form-data (product image uploads).
    "python-multipart>=0.0.18",
    "tzdata>=2026.4",
    "openpyxl>=3.1.5",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[tool.uv]
package = false

# ---------------------------------------------------------------------------
# Ruff — linting + formatting
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "ASYNC",# flake8-async
    "S",    # flake8-bandit (security)
    "T20",  # flake8-print
    "RUF",  # ruff-specific
]
ignore = [
    "B008",   # FastAPI Depends()/Query() in defaults is idiomatic
    "S101",   # assert is fine — pytest relies on it
    "UP046",  # Generic[...] is intentional (Pydantic model generics)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "T20"]
"app/core/config.py" = ["S105"]   # documented non-production defaults
"app/schemas/auth.py" = ["S105"]  # "bearer" token type is not a password
"app/core/permissions.py" = ["S105"]  # permission codes (e.g. users:reset_password) are not secrets

[tool.ruff.lint.isort]
known-first-party = ["app"]

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
ignore_missing_imports = true
show_error_codes = true
exclude = ["alembic/versions/"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers"
markers = [
    "integration: tests that require a live PostgreSQL instance",
]
filterwarnings = ["error::DeprecationWarning:app.*"]
